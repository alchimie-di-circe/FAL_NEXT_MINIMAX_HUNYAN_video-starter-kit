version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      # Mount the workspace
      - ..:/workspace:cached

      # Mount direnv config (if exists on host)
      - ~/.config/direnv:/home/node/.config/direnv:cached

      # Mount Git config
      - ~/.gitconfig:/home/node/.gitconfig:ro

      # Persist bash history
      - devcontainer-bash-history:/home/node/.bash_history_data

    working_dir: /workspace

    # Keep container running
    command: sleep infinity

    # Port mappings
    ports:
      - "3000:3000"  # Next.js dev server

    # Environment variables from .env file
    env_file:
      - .env.devcontainer

    environment:
      # Next.js environment
      - NODE_ENV=development

      # Enable direnv
      - DIRENV_LOG_FORMAT=

      # DigitalOcean (from host environment)
      - DIGITALOCEAN_API_TOKEN=${DIGITALOCEAN_API_TOKEN:-}

    # Network configuration
    networks:
      - ai-video-network

    # User and security
    user: node

    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

networks:
  ai-video-network:
    driver: bridge

volumes:
  devcontainer-bash-history:
    driver: local
